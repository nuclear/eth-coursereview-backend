[tools]
go = "1.23.12"
postgres = "17.7"
sqlc = "1.30.0"

[env]
DB_URL = "postgres://cr_user:mysecretpassword@localhost:5432/cr_db"
MIGRATIONS_PATH = "file://../sql/migrations"

# sets the envs for easily using `psql` locally
PGHOST = "localhost"
PGPORT = 5432
PGDATABASE = "cr_db"
PGUSER = "cr_user"
PGPASSWORD = "mysecretpassword"

# OAuth / JWT
OAUTH_CLIENT_ID = ""
OAUTH_CLIENT_SECRET = ""
OAUTH_PROVIDER_URL = "https://uniclubs.ch"
JWT_PRIVATE_KEY = ""
BACKEND_URL = "http://localhost:3000"
FRONTEND_URL = "http://localhost:5173"

# LLM moderation via OpenRouter (optional, fail-open if not set)
LLM_API_KEY = ""
LLM_BASE_URL = "https://openrouter.ai/api/v1"
LLM_MODEL = "anthropic/claude-haiku-4-5-20251001"
LLM_AUTO_APPROVE = "false"
